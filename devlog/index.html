<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devlog | elmariodev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!--
  Devlog of anything built for an elmariodev video (an agent, a game, a
  tool), in the channel's brand (brand/brand.md). One tab per checkpoint:
  what was built, who built it (model, time, tokens, API cost), what broke,
  how it was fixed, and the checks with their evidence (a chat reply, a
  screenshot or a clip). Everything meant to be revealed on camera is
  blurred behind an eye button. Plus the eval matrix, the decisions and the
  runbook. The page is what the audience sees on camera: nothing on it is a
  note for Mario (his lines live in script-notes.md, not here).
  Content: data.js (the build agent) and evals.js (the checks script).
  Without them it shows an example; "?ejemplo=juego" shows the other one.
-->
<style>
  :root {
    --accent: #ffb224; --ink: #140d02; --ground: #0c0b0a; --panel: #171614;
    --panel2: #1e1c19; --edge: #2b2925; --text: #f6f1ea; --muted: #8c867c;
    --marker: #ff3b2f; --pass: #4cc38a; --paper: #f3eee4;
    --display: "Archivo Black", "Arial Black", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--text); font: 15px/1.55 var(--body); }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent); }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; }
  code, pre, .mono { font-family: var(--mono); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Top bar and tabs */
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 28px 0; font-size: 13px; }
  .top img { width: 26px; height: 26px; }
  .top .crumb { color: var(--muted); font-family: var(--mono); }
  .top .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .examples { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .examples[hidden] { display: none; }
  .mock { font: 700 11px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink); background: var(--accent); padding: 4px 10px; border-radius: 4px; }
  .examples a { font: 700 11px var(--mono); color: var(--muted); text-decoration: none; padding: 4px 8px;
    border: 1px solid var(--edge); border-radius: 4px; }
  .examples a.on { color: var(--text); border-color: var(--accent); }
  .tabs { display: flex; gap: 4px; padding: 12px 28px; border-bottom: 1px solid var(--edge);
    overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; background: var(--ground); z-index: 5; }
  .tabs button { flex: none; background: none; border: 1px solid transparent; border-radius: 6px;
    padding: 5px 10px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--accent); background: rgba(255,178,36,.08); }
  .tabs .sep { width: 1px; background: var(--edge); margin: 4px 6px; flex: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); }
  .dot.done { background: var(--pass); border-color: var(--pass); }
  .dot.now { background: var(--accent); border-color: var(--accent); }

  main { max-width: 1240px; margin: 0 auto; padding: 28px 28px 80px; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 22px; }
  .label { font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .muted { color: var(--muted); }
  ul.plain { margin: 0; padding-left: 18px; }
  ul.plain li { margin: 3px 0; }
  .src { font: 11px var(--mono); color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 700 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    padding: 8px 10px; border-bottom: 1px solid var(--edge); }
  td { padding: 10px; border-bottom: 1px solid var(--edge); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-family: var(--mono); white-space: nowrap; }

  /* Reveal: anything with .rv is blurred until its eye is clicked (or R) */
  .rv { position: relative; }
  .rv > .rv-body { transition: filter .45s, opacity .45s; }
  .rv.shut > .rv-body { filter: blur(9px); opacity: .55; pointer-events: none; user-select: none; }
  .eye { position: absolute; inset: 0; margin: auto; z-index: 2; width: max-content; height: max-content;
    display: none; align-items: center; gap: 8px; background: rgba(12,11,10,.85); border: 1px solid var(--accent);
    color: var(--accent); border-radius: 999px; padding: 7px 14px 7px 11px; font: 700 11px var(--mono);
    letter-spacing: .08em; text-transform: uppercase; }
  .eye svg { width: 18px; height: 18px; }
  .eye.small { padding: 5px; } .eye.small span { display: none; }
  .rv.shut > .eye { display: inline-flex; }
  .eye:hover { background: var(--accent); color: var(--ink); }

  /* Overview */
  .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: end; margin-bottom: 24px; }
  .kicker { font: 700 12px var(--mono); color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }
  .hero h1 { font-size: 54px; line-height: 1; margin: 8px 0 12px; }
  .hero p { font-size: 18px; margin: 0; max-width: 40ch; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 16px 18px; text-align: left; }
  .tile .n { font-family: var(--display); font-size: 40px; line-height: 1; }
  .tile .n small { font-size: 18px; color: var(--muted); }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 24px; }
  .step { text-align: left; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 12px; }
  .step:hover { border-color: var(--muted); }
  .step .id { font: 700 11px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .step .t { font-family: var(--display); font-size: 15px; margin-top: 6px; line-height: 1.2; }
  .step.now { border-color: var(--accent); }
  .step.todo { opacity: .55; }
  .chapters li { margin: 8px 0; }
  .chapters b { font-family: var(--display); font-weight: 400; }
  .gap { margin-top: 16px; }

  /* Checkpoint */
  .cp-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .badge { font: 700 12px var(--mono); background: var(--accent); color: var(--ink); padding: 4px 9px; border-radius: 5px; }
  .cp-head h1 { font-size: 30px; }
  .cp-head .meta { font: 12px var(--mono); color: var(--muted); }
  .state { margin-left: auto; font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .08em;
    display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .cp-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; margin-bottom: 22px; }
  .goal { font-size: 18px; margin: 0 0 16px; }
  .box { border-left: 3px solid var(--edge); padding: 4px 0 4px 14px; margin-top: 16px; }
  .box.bad { border-color: var(--marker); }
  .box.good { border-color: var(--pass); }
  .box p { margin: 4px 0; }
  .tag { font: 700 11px var(--mono); color: var(--muted); border: 1px solid var(--edge); padding: 1px 5px; border-radius: 4px; margin-right: 6px; }
  pre { background: var(--ground); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px;
    font-size: 12.5px; overflow-x: auto; margin: 8px 0 0; white-space: pre-wrap; }
  .files { font: 11.5px var(--mono); color: var(--muted); margin-top: 6px; }
  .builds td:first-child b { font-family: var(--display); font-weight: 400; font-size: 15px; }

  /* The stage: a check's evidence (a chat in a fake browser, a screenshot, a clip) */
  .stage { border-radius: 12px; overflow: hidden; border: 1px solid var(--edge); aspect-ratio: 16 / 10;
    display: flex; flex-direction: column; position: relative; background: #000; }
  .stage > .rv, .stage > .rv > .rv-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .stage img, .stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .bar { background: #e6dfd2; padding: 8px 12px; display: flex; align-items: center; gap: 6px; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #c9c0b1; }
  .bar span { margin-left: 10px; font: 12px var(--mono); color: #6b6357; background: var(--paper); padding: 3px 12px; border-radius: 20px; }
  .chat { flex: 1; display: flex; flex-direction: column; background: #faf7f1; color: #2a241c; min-height: 0; }
  .chat .who { font: 700 11px var(--mono); padding: 10px 16px; border-bottom: 1px solid #e3dccf; color: #6b6357; display: flex; justify-content: space-between; }
  .chat .who b { font: 400 15px var(--display); color: #2a241c; }
  .chat .msgs { flex: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .bub { max-width: 80%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
  .bub.u { align-self: flex-end; background: #2a241c; color: #fff; border-bottom-right-radius: 3px; }
  .bub.b { align-self: flex-start; background: #fff; border: 1px solid #e3dccf; border-bottom-left-radius: 3px; }
  .bub-rv { align-self: flex-start; max-width: 80%; }
  .bub-rv .bub { max-width: none; }
  .bub-rv .eye { color: #6b6357; border-color: #c9c0b1; background: #fff; }
  .note { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; background: var(--panel2); font-size: 17px; text-align: center; }
  .stamp { position: absolute; right: 18px; bottom: 18px; z-index: 3; font: 400 22px var(--display); padding: 6px 14px; border: 3px solid;
    border-radius: 6px; transform: rotate(-6deg); background: rgba(250,247,241,.92); }
  .stamp.pass { color: #1d8a57; } .stamp.fail { color: var(--marker); }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .thumbs button { width: 92px; height: 58px; border-radius: 6px; border: 1px solid var(--edge); background: var(--panel2) center/cover;
    font: 700 10px var(--mono); color: var(--muted); padding: 0; }
  .thumbs button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
  .caption { font-size: 12.5px; color: var(--muted); margin-top: 6px; min-height: 1.4em; }

  /* Check chips under the stage: pick one, its verdict shows once revealed */
  .stage-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; min-height: 30px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .chip { text-align: left; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 3px; border-bottom-width: 3px; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,178,36,.07); }
  .chip.pass { border-bottom-color: var(--pass); } .chip.fail { border-bottom-color: var(--marker); }
  .chip-id { font: 700 10.5px var(--mono); color: var(--muted); display: flex; justify-content: space-between; }
  .chip-id i { font-style: normal; } .chip.pass i { color: var(--pass); } .chip.fail i { color: var(--marker); }
  .chip-t { font-size: 13px; line-height: 1.3; }
  .caption b { color: var(--text); font-weight: 600; }
  .over-note { position: absolute; left: 16px; bottom: 16px; background: rgba(12,11,10,.85); color: var(--text);
    font: 700 14px var(--mono); padding: 6px 10px; border-radius: 6px; }
  .stage .rv-body { position: relative; }

  .who-tag { font: 700 10.5px var(--mono); padding: 2px 6px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--edge); white-space: nowrap; }
  .verdict { font: 700 12px var(--mono); white-space: nowrap; }

  /* Matrix */
  .matrix td, .matrix th { text-align: center; }
  .matrix td:first-child, .matrix th:first-child, .matrix td:nth-child(2) { text-align: left; }
  .cell { display: inline-flex; width: 30px; height: 30px; border-radius: 7px; align-items: center; justify-content: center;
    font: 700 14px var(--mono); border: 0; }
  .cell.pass { background: rgba(76,195,138,.18); color: var(--pass); }
  .cell.fail { background: rgba(255,59,47,.16); color: var(--marker); }
  .cell.none { background: var(--panel2); color: var(--muted); }
  .matrix .col-eye { background: none; border: 1px solid var(--edge); border-radius: 6px; color: var(--accent); padding: 2px 6px; margin-top: 4px; }
  .matrix .col-eye svg { width: 14px; height: 14px; vertical-align: middle; }
  .matrix .shut-cell .cell { filter: blur(5px); opacity: .5; }
  .matrix tfoot td { font: 700 13px var(--mono); border-top: 1px solid var(--edge); }

  /* Decisions, runbook */
  .dec { display: grid; grid-template-columns: 70px 1fr auto; gap: 14px; padding: 14px 0; border-top: 1px solid var(--edge); }
  .dec .why { color: var(--muted); font-size: 13.5px; }
  .cmd { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--edge); }
  .cmd code { flex: 1; background: var(--ground); border: 1px solid var(--edge); padding: 7px 10px; border-radius: 6px; }
  .cmd button { background: none; border: 1px solid var(--edge); border-radius: 6px; padding: 6px 10px; font: 11px var(--mono); color: var(--muted); }
  .sec-title { font-size: 26px; margin-bottom: 6px; }
  .sec-sub { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }

  @media (max-width: 900px) {
    main { padding: 20px 16px 60px; }
    .top, .tabs { padding-left: 16px; padding-right: 16px; }
    .hero, .cp-grid, .two { grid-template-columns: 1fr; }
    .hero h1 { font-size: 40px; }
    .checks .exp, .builds .hide-sm { display: none; }
    .scroll-x { overflow-x: auto; }
  }
</style>
</head>
<body>
<header class="top">
  <img src="logo.svg" alt="">
  <span class="crumb">Devlog /</span><b id="pname"></b><span class="live" aria-hidden="true"></span>
  <span class="examples" id="examples" hidden>
    <span class="mock">Datos de ejemplo</span>
    <a href="?" data-ex="">Agente</a><a href="?ejemplo=juego" data-ex="juego">Juego</a>
  </span>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="view"></main>

<script>
// Loads data.js and evals.js next to this page, or an example when they are missing.
const load = (src) => new Promise((ok, ko) => {
  const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s);
});
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = (o) => new Intl.NumberFormat("es-CO", o);
const F = {
  time: (s) => s == null ? "sin dato" : s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min` : s >= 60 ? `${Math.round(s / 60)} min` : `${Math.round(s)} s`,
  tokens: (n) => n == null ? "sin dato" : n >= 1e6 ? `${nf({ maximumFractionDigits: 1 }).format(n / 1e6)} M` : `${nf().format(Math.round(n / 1000))} mil`,
  usd: (n) => n == null ? "sin dato" : `US$ ${nf({ minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n)}`,
  int: (n) => n == null ? "sin dato" : nf().format(n),
};
const EYE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const STATE = { done: "Listo", now: "En curso", todo: "Pendiente" };
const shown = new Set();   // keys of revealed blocks
const picked = {};         // checkpoint id -> what the stage shows

// A block blurred behind an eye until revealed. key must be unique on the page.
const rv = (key, html, small) => `<div class="rv ${shown.has(key) ? "" : "shut"}" data-rv="${key}">
  <div class="rv-body">${html}</div><button class="eye ${small ? "small" : ""}" data-show="${key}" aria-label="Mostrar">${EYE}<span>Mostrar</span></button></div>`;

(async () => {
  const ex = new URLSearchParams(location.search).get("ejemplo") === "juego" ? "-juego" : "";
  let example = false;
  await load("data.js").catch(() => { example = true; return load(`data.example${ex}.js`); });
  await load("evals.js").catch(() => load(`evals.example${ex}.js`)).catch(() => {});
  const D = window.DEVLOG, E = window.DEVLOG_EVALS || { checks: [], runs: [] };
  const CHECKS = E.label || "Pruebas";
  if (example) {
    const box = document.getElementById("examples"); box.hidden = false;
    box.querySelectorAll("a").forEach((a) => a.classList.toggle("on", "-" + a.dataset.ex === ex || (!ex && !a.dataset.ex)));
  }
  document.getElementById("pname").textContent = D.project.name;
  document.title = `${D.project.name} | Devlog`;

  const runOf = (cpId) => [...E.runs].reverse().find((r) => r.checkpoint === cpId);
  const passCount = (run) => run ? E.checks.filter((c) => run.results[c.id]?.pass === true).length : null;
  const check = (id) => E.checks.find((c) => c.id === id);
  const lastRun = E.runs[E.runs.length - 1];
  const verdict = (r) => r?.pass === true ? "pass" : r?.pass === false ? "fail" : "";

  const tabs = [
    { id: "resumen", label: "Resumen" },
    ...D.checkpoints.map((c, i) => ({ id: c.id, label: `${i} · ${c.title}`, dot: c.status })),
    { sep: true },
    { id: "evals", label: "Evals" },
    { id: "decisiones", label: "Decisiones" }, { id: "runbook", label: "Runbook" },
  ];
  const nav = document.getElementById("tabs");
  nav.innerHTML = tabs.map((t) => t.sep ? `<span class="sep"></span>` :
    `<button role="tab" data-tab="${t.id}">${t.dot ? `<span class="dot ${t.dot}"></span>` : ""}${esc(t.label)}</button>`).join("");
  nav.addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) location.hash = b.dataset.tab; });

  const view = document.getElementById("view");
  const current = () => tabs.find((t) => t.id === location.hash.slice(1)) ? location.hash.slice(1) : "resumen";
  const go = () => {
    const tab = current();
    nav.querySelectorAll("[data-tab]").forEach((b) => {
      const on = b.dataset.tab === tab; b.setAttribute("aria-selected", on);
      if (on) b.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    const cp = D.checkpoints.find((c) => c.id === tab);
    view.innerHTML = cp ? checkpoint(cp) : ({ resumen: overview, evals: matrix, decisiones: decisions, runbook }[tab])();
  };
  window.addEventListener("hashchange", () => { go(); window.scrollTo(0, 0); });

  // The decided decisions a checkpoint names
  const decided = (c) => (c.decisions || []).map((id) => D.decisions.find((d) => d.id === id)).filter((d) => d && d.status !== "open");

  // Who built it: one row per model, numbers behind the eye
  function builds(rows, key) {
    if (!rows?.length) return `<p class="empty">Todavía no.</p>`;
    const body = `<table class="builds"><thead><tr><th>Modelo</th><th class="num">Tiempo</th><th class="num">Tokens entrada</th>
      <th class="num">Tokens salida</th><th class="num hide-sm">Herramientas</th><th class="num">Costo por API</th></tr></thead><tbody>
      ${rows.map((b) => `<tr><td><b>${esc(b.model)}</b><div class="src">${esc(b.harness || "")}</div></td>
        <td class="num">${F.time(b.seconds)}</td><td class="num">${F.tokens(b.tokensIn)}</td><td class="num">${F.tokens(b.tokensOut)}</td>
        <td class="num hide-sm">${F.int(b.toolCalls)}</td><td class="num"><b>${F.usd(b.apiCostUsd)}</b></td></tr>`).join("")}</tbody></table>`;
    return rv(key, body) + `<p class="src" style="margin:10px 0 0">Costo por API: lo que costarían los mismos tokens pagando por API, aunque se usó la suscripción. ${esc(rows.map((b) => b.source).filter(Boolean).join(" · "))}</p>`;
  }
  // The whole build, summed per model over the checkpoints
  function totals() {
    const m = {};
    D.checkpoints.forEach((c) => (c.build || []).forEach((b) => {
      const t = m[b.model] ||= { model: b.model, harness: b.harness, seconds: 0, tokensIn: 0, tokensOut: 0, toolCalls: 0, apiCostUsd: 0 };
      ["seconds", "tokensIn", "tokensOut", "toolCalls"].forEach((k) => t[k] += b[k] || 0);
      t.apiCostUsd = b.apiCostUsd == null || t.apiCostUsd == null ? null : t.apiCostUsd + b.apiCostUsd;
    }));
    return Object.values(m);
  }

  function overview() {
    const done = D.checkpoints.filter((c) => c.status === "done").length;
    return `
      <section class="hero">
        <div><div class="kicker">${esc(D.project.kicker)}</div><h1>${esc(D.project.name)}</h1><p>${esc(D.project.oneLine)}</p></div>
        <div class="tiles">
          <div class="tile"><div class="label">Checkpoints</div><div class="n">${done}<small> / ${D.checkpoints.length}</small></div></div>
          <div class="tile"><div class="label">${esc(CHECKS)} que pasan</div><div class="n">${lastRun ? passCount(lastRun) : "-"}<small> / ${E.checks.length}</small></div>
            <div class="src">${lastRun ? `run ${esc(lastRun.checkpoint)} · ${esc(lastRun.at)}` : "sin corridas"}</div></div>
        </div>
      </section>
      <div class="steps">${D.checkpoints.map((c, i) => `
        <button class="step ${c.status}" onclick="location.hash='${c.id}'">
          <div class="id"><span class="dot ${c.status}"></span>CP ${i} · ${STATE[c.status]}</div>
          <div class="t">${esc(c.title)}</div></button>`).join("")}</div>
      <div class="card"><div class="label">Todo el build, hasta ahora</div><div class="scroll-x">${builds(totals(), "total")}</div></div>
      <div class="two gap">
        <div class="card"><div class="label">Capítulos</div><ol class="chapters plain">${D.chapters.map((ch) =>
          `<li><b>${esc(ch.title)}</b> <span class="src">${ch.checkpoints.join(", ")}</span></li>`).join("")}</ol></div>
        <div class="card"><div class="label">El stack</div><table>${D.project.stack.map((s) =>
          `<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(s.role)}</div></td><td>${esc(s.note || "")}<div class="src">${esc(s.source || "")}</div></td></tr>`).join("")}</table></div>
      </div>`;
  }

  function checkpoint(c) {
    const i = D.checkpoints.indexOf(c), run = runOf(c.id);
    const ch = D.chapters.find((x) => x.checkpoints.includes(c.id));
    if (!picked[c.id]) picked[c.id] = run && c.hero ? { check: c.hero } : c.media?.length ? { media: 0 } : run ? { check: E.checks[0]?.id } : {};
    const list = (items) => items?.length ? `<ul class="plain">${items.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p class="empty">Todavía nada.</p>`;
    const broke = c.broke?.length ? c.broke.map((b) => `<p>${b.check ? `<span class="tag">${esc(b.check)}</span>` : ""}${esc(b.text)}</p>`).join("") : `<p class="empty">Nada todavía.</p>`;
    const n = passCount(run);
    return `
      <div class="cp-head">
        <span class="badge">CP ${String(i).padStart(2, "0")}</span><h1>${esc(c.title)}</h1>
        <span class="meta">${ch ? `Capítulo ${ch.n}` : ""}${c.date ? ` · ${esc(c.date)}` : ""}${c.commit ? ` · tag ${esc(c.id)} · ${esc(c.commit)}` : ""}</span>
        <span class="state"><span class="dot ${c.status}"></span>${STATE[c.status]}</span>
      </div>
      <div class="cp-grid">
        <div>
          <div class="stage-head">
            <div><span class="label" style="margin:0">${esc(CHECKS)}</span>
              <span class="src">${run ? ` run ${esc(run.at)}${run.model ? ` · ${esc(run.model)}` : ""}` : " sin corrida en este checkpoint"}</span></div>
            ${run ? rv(`score-${c.id}`, `<span class="verdict">${n} / ${E.checks.length} pasan</span>`, true) : ""}
          </div>
          ${stage(c)}
          ${run ? `<div class="chips">${E.checks.map((x) => { const v = shown.has(`res-${c.id}-${x.id}`) ? verdict(run.results[x.id]) : "";
            return `<button class="chip ${v}" aria-pressed="${picked[c.id].check === x.id}" data-check="${x.id}">
              <span class="chip-id">${esc(x.id)}${x.who ? ` · ${esc(x.who)}` : ""}<i>${v === "pass" ? "✓" : v === "fail" ? "✗" : ""}</i></span>
              <span class="chip-t">${esc(x.text)}</span></button>`; }).join("")}</div>` : ""}
          ${c.media?.length ? `<div class="thumbs">${c.media.map((m, k) => `<button aria-pressed="${picked[c.id].media === k}" data-media="${k}"
              style="background-image:url('${m.kind === "image" ? esc(m.src) : ""}')">${m.kind === "video" ? "▶ clip" : ""}</button>`).join("")}</div>` : ""}
          <div class="caption">${caption(c)}</div>
        </div>
        <div>
          <p class="goal">${esc(c.goal)}</p>
          <div class="label">Qué se construyó</div>${list(c.built)}
          <div class="box bad"><div class="label">Qué se rompió</div>${c.broke?.length ? rv(`broke-${c.id}`, broke) : broke}</div>
          <div class="box good"><div class="label">Cómo se arregló</div>${c.fixed?.length ? c.fixed.map((f) => `<p>${esc(f.text)}</p>
            ${f.code ? `<pre>${esc(f.code)}</pre>` : ""}${f.files ? `<div class="files">${f.files.map(esc).join(" · ")}</div>` : ""}`).join("") : `<p class="empty">${i === 0 ? "Este es el punto de partida." : "Todavía nada."}</p>`}</div>
        </div>
      </div>
      <div class="card"><div class="label">Quién lo construyó</div><div class="scroll-x">${builds(c.build, `build-${c.id}`)}</div></div>
      <div class="two" style="margin-top:16px">
        <div class="card"><div class="label">Números</div>${c.numbers?.length ? `<table>${c.numbers.map((x) =>
          `<tr><td>${esc(x.label)}</td><td style="text-align:right"><b class="mono">${esc(x.value)}</b><div class="src">${esc(x.source)}</div></td></tr>`).join("")}</table>` : `<p class="empty">Sin números en este paso.</p>`}</div>
        <div class="card"><div class="label">Decisiones</div>${decided(c).length ? decided(c).map((d) =>
          `<p style="margin:0 0 10px"><span class="tag">${esc(d.id)}</span>${esc(d.text)}<br><span class="muted" style="font-size:13.5px">${esc(d.why)}</span></p>`).join("") : `<p class="empty">Ninguna en este paso.</p>`}</div>
      </div>`;
  }

  function caption(c) {
    const p = picked[c.id];
    if (p.media !== undefined) return esc(c.media[p.media]?.caption || "");
    const x = check(p.check); return x ? `<b>Se espera:</b> ${esc(x.expect)}` : "";
  }

  // The stage shows a media file, or the evidence of one check: a chat, an image or a clip
  function stage(c) {
    const p = picked[c.id];
    const file = (src, kind, alt) => kind === "video" || /\.(webm|mp4|mov)$/i.test(src)
      ? `<video src="${esc(src)}" controls muted playsinline></video>` : `<img src="${esc(src)}" alt="${esc(alt || "")}">`;
    if (p.media !== undefined) { const m = c.media[p.media]; return `<div class="stage">${file(m.src, m.kind, m.caption)}</div>`; }
    const x = check(p.check), r = runOf(c.id)?.results[x?.id], key = `res-${c.id}-${x?.id}`, v = verdict(r);
    if (!x) return `<div class="stage"><div class="note muted">Sin evidencia todavía.</div></div>`;
    const stamp = v && shown.has(key) ? `<div class="stamp ${v}">${v === "pass" ? "PASA" : "FALLA"}</div>` : "";
    if (r?.media) return `<div class="stage">${rv(key, file(r.media, null, x.text) + (r.note ? `<div class="over-note">${esc(r.note)}</div>` : ""))}${stamp}</div>`;
    if (r?.reply !== undefined) return `<div class="stage">
      ${D.project.url ? `<div class="bar"><i></i><i></i><i></i><span>${esc(D.project.url)}</span></div>` : ""}
      <div class="chat"><div class="who"><b>${esc(D.project.name)}</b>${x.who ? `<span>Entraste como: ${esc(x.who)}</span>` : ""}</div>
        <div class="msgs"><div class="bub u">${esc(x.text)}</div><div class="bub-rv">${rv(key, `<div class="bub b">${esc(r.reply)}</div>`, true)}</div></div></div>${stamp}</div>`;
    return `<div class="stage">${rv(key, `<div class="note">${esc(r?.note || "Sin corrida todavía.")}</div>`)}${stamp}</div>`;
  }

  // Evals: every check against every checkpoint; each column behind its eye
  function matrix() {
    const cell = (cp, x) => { const v = verdict(runOf(cp.id)?.results[x.id]) || "none";
      return `<td class="${shown.has(`col-${cp.id}`) || v === "none" ? "" : "shut-cell"}"><button class="cell ${v}" onclick="location.hash='${cp.id}'">${v === "pass" ? "✓" : v === "fail" ? "✗" : "·"}</button></td>`; };
    return `<h1 class="sec-title">Evals</h1><p class="sec-sub">Las mismas ${esc(CHECKS.toLowerCase())} contra cada checkpoint. Cada columna es la última corrida de ese checkpoint; el ojo la muestra.</p>
      <div class="card scroll-x"><table class="matrix"><thead><tr><th>Prueba</th><th>${E.checks.some((x) => x.who) ? "Quién" : ""}</th>${D.checkpoints.map((c, i) =>
        `<th>CP ${i}${runOf(c.id) && !shown.has(`col-${c.id}`) ? `<br><button class="col-eye" data-show="col-${c.id}" aria-label="Mostrar CP ${i}">${EYE}</button>` : ""}</th>`).join("")}</tr></thead>
      <tbody>${E.checks.map((x) => `<tr><td>${esc(x.text)}</td><td>${x.who ? `<span class="who-tag">${esc(x.who)}</span>` : ""}</td>${D.checkpoints.map((c) => cell(c, x)).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="2">Pasan</td>${D.checkpoints.map((c) => { const n = passCount(runOf(c.id)); return `<td>${n === null ? "-" : shown.has(`col-${c.id}`) ? `${n}/${E.checks.length}` : "?"}</td>`; }).join("")}</tr></tfoot></table></div>`;
  }

  function decisions() {
    return `<h1 class="sec-title">Decisiones</h1><p class="sec-sub">Lo que se decidió y por qué.</p>
      <div class="card">${D.decisions.filter((d) => d.status !== "open").map((d) => { const used = D.checkpoints.filter((c) => c.decisions?.includes(d.id));
        return `<div class="dec"><span class="mono muted">${esc(d.id)}</span><div><div>${esc(d.text)}</div>
          <div class="why">${esc(d.why)}</div></div><div class="src" style="text-align:right">${esc(d.date)} · ${esc(d.by)}<br>${used.map((c) => `<a href="#${c.id}">${c.id}</a>`).join(" ")}</div></div>`; }).join("")}</div>`;
  }

  function runbook() {
    return `<h1 class="sec-title">Runbook</h1><p class="sec-sub">Cómo correrlo. Repo: ${esc(D.project.repo)}</p>
      <div class="card">${D.runbook.map((r) => `<div class="cmd"><span style="width:200px">${esc(r.label)}</span><code>${esc(r.cmd)}</code>
        <button data-copy="${esc(r.cmd)}">copiar</button></div>`).join("")}</div>`;
  }

  // Clicks: an eye reveals its block, a row or thumb picks what the stage shows
  const rerender = () => { const y = window.scrollY; go(); window.scrollTo(0, y); };
  view.addEventListener("click", (e) => {
    const eye = e.target.closest("[data-show]");
    if (eye) { shown.add(eye.dataset.show); return rerender(); }
    const copy = e.target.closest("[data-copy]");
    if (copy) { navigator.clipboard?.writeText(copy.dataset.copy); copy.textContent = "copiado"; return; }
    const c = D.checkpoints.find((x) => x.id === current());
    if (!c) return;
    const m = e.target.closest("[data-media]"), x = e.target.closest("[data-check]");
    if (m) picked[c.id] = { media: +m.dataset.media };
    else if (x) picked[c.id] = { check: x.dataset.check };
    else return;
    rerender();
  });
  // Keys: left and right move between tabs, R shows everything on the tab, H hides it again
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const ids = tabs.filter((t) => !t.sep).map((t) => t.id), k = ids.indexOf(current());
    const keys = () => [...view.querySelectorAll("[data-rv]")].map((n) => n.dataset.rv)
      .concat(current() === "evals" ? D.checkpoints.map((c) => `col-${c.id}`) : []);
    if (e.key === "ArrowRight" && k < ids.length - 1) location.hash = ids[k + 1];
    else if (e.key === "ArrowLeft" && k > 0) location.hash = ids[k - 1];
    else if (e.key.toLowerCase() === "r") {
      const c = D.checkpoints.find((x) => x.id === current());
      if (c) E.checks.forEach((x) => shown.add(`res-${c.id}-${x.id}`));
      keys().forEach((key) => shown.add(key)); rerender();
    } else if (e.key.toLowerCase() === "h") {
      [...shown].forEach((key) => { if (key.includes(current()) || key === "total" || key.startsWith("col-")) shown.delete(key); }); rerender();
    }
  });
  go();
})();
</script>
</body>
</html>
